<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MNIT Media Grabber</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <header class="card">
      <div class="card-head">
        <img src="icons/logo256.png" alt="MNIT" class="logo-sm">
        <div class="brand"><strong data-i18n="appName"></strong><span class="by">by MNIT Cyber AI</span></div>
        <button id="btnRefresh" class="icon-btn" data-i18n-title="refresh">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
      </div>
      <div class="card-body">
        <div id="tabTitle" class="tab-title"></div>
      </div>
      <div class="card-foot">
        <span><span data-i18n="versionLabel"></span> <b id="versionNum" dir="ltr"></b> · <span data-i18n="versionValue"></span></span>
        <div class="card-foot-right">
          <button id="btnPro" class="pro-badge">⭐ Pro</button>
          <span id="countLabel" class="count"></span>
        </div>
      </div>
    </header>

    <main id="main"></main>

    <footer class="toolbar">
      <button id="btnSettings" class="tb" data-i18n-title="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <div class="spacer"></div>
      <button id="btnNoVideo" class="tb text" data-i18n="noVideo"></button>
      <button id="btnLang" class="tb" data-i18n-title="language">
        <svg viewBox="0 0 24 24"><path d="M4 5h8M8 3v2m2 0c-.8 3.5-3 6.5-6 8m2.5-4.5c1 1.6 2.6 3 4.5 3.8M13 21l4-9 4 9m-6.8-3h5.6"/></svg>
      </button>
      <button id="btnHistory" class="tb" data-i18n-title="history">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button id="btnFolder" class="tb" data-i18n-title="openFolder">
        <svg viewBox="0 0 24 24" class="filled"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button id="btnClear" class="tb" data-i18n-title="clearList">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
      </button>
      <button id="btnHelp" class="tb" data-i18n-title="help">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>
      </button>
      <button id="btnClose" class="tb" data-i18n-title="closePanel">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16" /><rect x="15" y="4" width="6" height="16" class="fill-rect"/></svg>
      </button>
    </footer>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
